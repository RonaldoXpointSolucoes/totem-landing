<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="body-grad-floor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="screen-grad-floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow-floor" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base de sustentação no chão -->
  <path d="M 80 540 L 320 540 L 340 570 L 60 570 Z" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="70" y="565" width="260" height="6" rx="3" fill="#475569"/>

  <!-- Coluna / Corpo Principal -->
  <path d="M 110 90 Q 110 60 140 60 L 260 60 Q 290 60 290 90 L 285 540 L 115 540 Z" fill="url(#body-grad-floor)" stroke="#475569" stroke-width="2"/>
  <path d="M 125 75 L 275 75" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Moldura e Tela Touch 21.5" -->
  <rect x="135" y="110" width="130" height="200" rx="10" fill="#020617" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow-floor)"/>
  <rect x="142" y="118" width="116" height="184" rx="6" fill="url(#screen-grad-floor)"/>
  <!-- UI Mockup na Tela -->
  <circle cx="200" cy="180" r="28" fill="#4338ca" opacity="0.6"/>
  <rect x="160" y="225" width="80" height="10" rx="5" fill="#38bdf8" opacity="0.8"/>
  <rect x="175" y="245" width="50" height="6" rx="3" fill="#94a3b8" opacity="0.5"/>

  <!-- Slot da Impressora Térmica 80mm -->
  <rect x="155" y="340" width="90" height="26" rx="4" fill="#020617" stroke="#64748b" stroke-width="1.5"/>
  <rect x="165" y="350" width="70" height="5" rx="2.5" fill="#06b6d4"/>
  <path d="M 180 357 L 220 357 L 215 375 L 185 375 Z" fill="#f8fafc" opacity="0.9"/>

  <!-- Slot do Leitor de Código de Barras / QR Code -->
  <rect x="168" y="395" width="64" height="40" rx="8" fill="#020617" stroke="#6366f1" stroke-width="1.5"/>
  <rect x="176" y="403" width="48" height="24" rx="4" fill="#18181b"/>
  <line x1="182" y1="415" x2="218" y2="415" stroke="#ef4444" stroke-width="2" opacity="0.8"/>

  <!-- Frisos Tecnológicos e LEDs Laterais -->
  <line x1="117" y1="120" x2="117" y2="500" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="283" y1="120" x2="283" y2="500" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Fechadura de Acesso -->
  <circle cx="270" cy="460" r="5" fill="#64748b" stroke="#94a3b8" stroke-width="1"/>
  <line x1="270" y1="458" x2="270" y2="462" stroke="#0f172a" stroke-width="1.5"/>
</svg>
