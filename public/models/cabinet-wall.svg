<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="body-grad-wall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="screen-grad-wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <filter id="glow-wall" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Suporte de Fixação Traseira na Parede (Sombra e Aço) -->
  <rect x="110" y="45" width="180" height="410" rx="16" fill="#000000" opacity="0.4"/>
  <rect x="115" y="40" width="170" height="400" rx="16" fill="#334155" stroke="#475569" stroke-width="1.5"/>

  <!-- Chassi Principal do Gabinete de Parede -->
  <rect x="120" y="45" width="160" height="390" rx="14" fill="url(#body-grad-wall)" stroke="#64748b" stroke-width="2"/>

  <!-- Moldura e Tela Touch -->
  <rect x="135" y="65" width="130" height="190" rx="10" fill="#020617" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow-wall)"/>
  <rect x="142" y="73" width="116" height="174" rx="6" fill="url(#screen-grad-wall)"/>
  <!-- Ícone e Conteúdo Gráfico da Tela -->
  <circle cx="200" cy="130" r="24" fill="#6366f1" opacity="0.6"/>
  <rect x="165" y="170" width="70" height="8" rx="4" fill="#38bdf8" opacity="0.8"/>
  <rect x="175" y="188" width="50" height="6" rx="3" fill="#94a3b8" opacity="0.5"/>

  <!-- Abertura da Impressora Térmica -->
  <rect x="150" y="275" width="100" height="24" rx="4" fill="#020617" stroke="#64748b" stroke-width="1.5"/>
  <rect x="160" y="284" width="80" height="4" rx="2" fill="#06b6d4"/>
  <path d="M 175 290 L 225 290 L 220 306 L 180 306 Z" fill="#f8fafc" opacity="0.9"/>

  <!-- Abertura do Leitor de QR Code / Código de Barras -->
  <rect x="165" y="325" width="70" height="44" rx="8" fill="#020617" stroke="#6366f1" stroke-width="1.5"/>
  <rect x="173" y="333" width="54" height="28" rx="4" fill="#18181b"/>
  <line x1="180" y1="347" x2="220" y2="347" stroke="#ef4444" stroke-width="2" opacity="0.8"/>

  <!-- Aberturas de Ventilação Inferior -->
  <line x1="160" y1="395" x2="240" y2="395" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <line x1="165" y1="403" x2="235" y2="403" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <line x1="170" y1="411" x2="230" y2="411" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
</svg>
