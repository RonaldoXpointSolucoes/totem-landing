<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="body-grad-counter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="screen-grad-counter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="glow-counter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base de Apoio Antiderrapante para Balcão -->
  <ellipse cx="200" cy="410" rx="140" ry="24" fill="#000000" opacity="0.4"/>
  <rect x="90" y="380" width="220" height="24" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <rect x="110" y="398" width="180" height="6" rx="3" fill="#06b6d4" opacity="0.8"/>

  <!-- Coluna Inclinada e Chassi Ergonômico -->
  <path d="M 120 100 Q 120 70 150 70 L 250 70 Q 280 70 280 100 L 290 380 L 110 380 Z" fill="url(#body-grad-counter)" stroke="#64748b" stroke-width="2"/>

  <!-- Tela Touchscreen Angular 15.6" -->
  <rect x="135" y="90" width="130" height="170" rx="10" fill="#020617" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow-counter)"/>
  <rect x="142" y="97" width="116" height="156" rx="6" fill="url(#screen-grad-counter)"/>
  <!-- UI Gráfica da Tela -->
  <circle cx="200" cy="150" r="22" fill="#6366f1" opacity="0.6"/>
  <rect x="165" y="190" width="70" height="8" rx="4" fill="#38bdf8" opacity="0.8"/>
  <rect x="175" y="206" width="50" height="6" rx="3" fill="#94a3b8" opacity="0.5"/>

  <!-- Impressora Embutida com Saída Superior -->
  <rect x="150" y="280" width="100" height="24" rx="4" fill="#020617" stroke="#64748b" stroke-width="1.5"/>
  <rect x="160" y="289" width="80" height="4" rx="2" fill="#06b6d4"/>
  <path d="M 175 295 L 225 295 L 220 310 L 180 310 Z" fill="#f8fafc" opacity="0.9"/>

  <!-- Leitor Frontal Ergonômico -->
  <rect x="165" y="322" width="70" height="38" rx="6" fill="#020617" stroke="#6366f1" stroke-width="1.5"/>
  <line x1="175" y1="341" x2="225" y2="341" stroke="#ef4444" stroke-width="2" opacity="0.8"/>
</svg>
